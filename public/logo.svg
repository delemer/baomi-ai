<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="爆米AI">
  <!-- 黑色圆角矩形 + 白色「米」：按 Noto Sans CJK SC 字形结构手工矢量（横竖主笔 + 上两点 + 下两捺），不依赖字体 -->
  <rect width="512" height="512" rx="118" fill="#111111"/>
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="butt" fill="none">
    <!-- 横（主笔，略偏上） -->
    <path d="M98 250 H414"/>
    <!-- 竖（主笔） -->
    <path d="M256 70 V450"/>
    <!-- 上左点 -->
    <path d="M134 132 L186 216"/>
    <!-- 上右点 -->
    <path d="M378 132 L326 216"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none">
    <!-- 左下撇 -->
    <path d="M240 258 Q180 348 116 402"/>
    <!-- 右下捺 -->
    <path d="M272 258 Q332 348 396 402"/>
  </g>
</svg>
